# ── Identificación del proyecto en SonarCloud ────────────────────────────────
sonar.projectKey=cmoreno81_clubdelectura
sonar.organization=cmoreno81
sonar.projectName=ClubReaders

# ── Fuentes ──────────────────────────────────────────────────────────────────
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# ── Coverage (generado por flutter test --coverage) ──────────────────────────
sonar.dart.lcov.reportPaths=coverage/lcov_cleaned.info

# ── Exclusiones ───────────────────────────────────────────────────────────────
# Archivos generados automáticamente (no analizar ni contar en cobertura)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,lib/main.dart
